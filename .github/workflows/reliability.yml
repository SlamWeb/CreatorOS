name: Reliability checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reliability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  PYTHON_DOTENV_DISABLED: '1'
  # No model/publishing credentials. Browser groups use controlled fixtures.

jobs:
  backend:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/reliability-runtime
        with:
          python-deps: 'true'
          media: 'true'
      - name: Backend reliability allowlist shard ${{ matrix.shard }}/2
        run: python -m tests.run_reliability --shard ${{ matrix.shard }}/2
      - name: Preserve backend logs, coverage receipts and codec proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reliability-backend-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tmp/reliability-*/
            tmp/ci-backend/media-preflight/
          if-no-files-found: warn
          retention-days: 14

  benchmark-contracts:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/reliability-runtime
        with:
          python-deps: 'true'
          media: 'true'
      - name: Benchmark grading and freeze contracts (no models)
        run: python -m tests.run_reliability --suite benchmark
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reliability-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tmp/reliability-*/
            tmp/ci-benchmark-contracts/media-preflight/
          if-no-files-found: warn
          retention-days: 14

  frontend:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/reliability-runtime
        with:
          node: 'true'
      - name: Frontend types, build and local state tests
        run: |
          npm --prefix web run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix web run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node web/e2e-all.mjs --plan
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test web/tests/*.test.mjs
      - name: Inventory Python coverage without importing unreviewed modules
        if: always()
        run: python -m tests.run_reliability --inventory > "$env:TEMP/coverage-inventory.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reliability-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/ci-frontend/coverage-inventory.json
          if-no-files-found: error
          retention-days: 14

  browsers:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [general, agent-plan, staged, compact, media, reference-selection]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/reliability-runtime
        with:
          python-deps: 'true'
          node: 'true'
          media: 'true'
          chrome: 'true'
      - name: Complete controlled ${{ matrix.group }} isolation group
        run: node web/e2e-all.mjs --group ${{ matrix.group }}
      - name: Preserve group summaries, reports, screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reliability-browser-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tmp/ci-browsers/creatoros-e2e-all-*/
            tmp/ci-browsers/media-preflight/
            tmp/media-e2e-all-*/
          if-no-files-found: warn
          retention-days: 14

  parallel-isolation:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/reliability-runtime
        with:
          python-deps: 'true'
          node: 'true'
          media: 'true'
          chrome: 'true'
      - name: Prepare a second independent checkout
        shell: pwsh
        run: |
          $second = Join-Path $env:RUNNER_TEMP 'creatoros-ci-second'
          if (Test-Path -LiteralPath $second) { throw 'Second checkout already exists' }
          git worktree add --detach $second $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix (Join-Path $second 'web') ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CREATOROS_SECOND_WORKTREE=$second" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify isolated worktrees and fixture boundaries
        run: python -m tests.run_reliability --suite isolation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reliability-parallel-isolation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tmp/reliability-*/
            tmp/ci-parallel-isolation/
          if-no-files-found: warn
          retention-days: 14

  benchmark-refresh:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/reliability-runtime
        with:
          node: 'true'
          chrome: 'true'
      - name: Real Chrome and loopback HTTP refresh regression (9 required cases)
        run: node --test web/e2e/benchmark-refresh.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reliability-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/ci-benchmark-refresh/creatoros-benchmark-refresh-*/
          if-no-files-found: error
          retention-days: 14
