<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skill 工作台 · 设计探索</title><style>
:root{font-family:Inter,'Microsoft YaHei',sans-serif;color:#1e2633;background:#f8f9fb;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #3386ee;outline-offset:2px}.shell{display:grid;grid-template-columns:76px 1fr;min-height:100vh}.nav{background:#fff;border-right:1px solid #e7e9ef;padding:25px 13px;display:flex;align-items:center;flex-direction:column;gap:24px;color:#687587}.logo{font-size:29px;font-weight:850;color:#1477ed;line-height:1}.nav span:not(.logo){font-size:11px}.main{padding:30px 4vw 105px;max-width:1640px;width:100%;margin:auto}header{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}h1{font-size:30px;letter-spacing:-.03em;margin:0}h2{margin:0;font-size:17px}p{margin:0}.sub{font-size:13px;color:#697587;margin-top:9px}.notice{display:inline-block;padding:7px 10px;border-radius:7px;background:#fff3dd;color:#79531b;font-size:12px}.topactions,.tools,.pills{display:flex;gap:8px;flex-wrap:wrap}.topactions{margin:22px 0 27px}button.action,.outline{border:1px solid #d6dfeb;background:#fff;color:#225a9e;border-radius:9px;padding:9px 14px}.action.primary{background:#1673e6;color:white;border-color:#1673e6}.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:26px;align-items:start}.workspace{background:white;border:1px solid #e3e8ef;border-radius:16px;padding:20px;position:sticky;top:18px}.workspace-head{display:flex;justify-content:space-between;align-items:center}.workspace .target{padding:12px;background:#f6f8fb;border-radius:10px;margin:18px 0;color:#3f4e60;font-size:13px}.workspace .target strong{display:block;color:#182535;margin-top:4px;font-size:15px}.dropzone{border:1.5px dashed #bbc9da;border-radius:12px;min-height:140px;padding:12px;display:flex;flex-direction:column;gap:8px;justify-content:center}.dropzone.over{border-color:#1673e6;background:#eff6ff}.empty{text-align:center;color:#617183;font-size:13px;line-height:1.8}.selected{display:flex;gap:9px;align-items:center;background:#f5f8fc;border-radius:9px;padding:9px 10px;font-size:13px}.selected b{flex:1}.remove{border:0;background:transparent;color:#687587;font-size:18px}.workspace-foot{margin-top:14px;display:grid;gap:9px}.workspace-foot button{width:100%;text-align:center}.footnote{font-size:12px;line-height:1.7;color:#657184;margin-top:13px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.muted{color:#6c7989;font-size:13px}.search{width:100%;border:1px solid #d8e0e9;background:white;border-radius:10px;padding:12px 14px;margin-bottom:14px}.pill{border:0;background:transparent;border-radius:8px;padding:8px 10px;color:#5b6878;font-size:13px}.pill.active{background:#e7f0ff;color:#135ebc;font-weight:650}.pills{margin-bottom:20px}.item{background:white;border:1px solid #e5e9ef;border-radius:14px;min-width:0;display:flex;gap:13px;padding:15px;align-items:flex-start}.item-copy{min-width:0;flex:1}.item strong{display:block;font-size:14px;overflow-wrap:anywhere}.desc{font-size:12px;color:#657487;line-height:1.55;margin-top:7px}.cat{font-size:11px;color:#657487;margin-top:11px;display:block}.badge{flex:0 0 40px;width:40px;height:40px;display:grid;place-items:center;border-radius:12px;color:var(--fg);background:var(--bg)}.badge svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.add{border:0;background:#f3f6fa;color:#215fa9;border-radius:8px;min-width:32px;height:32px;font-size:20px;line-height:1}.add[aria-pressed=true]{background:#e1f2e9;color:#287651;font-size:16px}.grab{cursor:grab}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.type-mind{--fg:#525fc4;--bg:#e9ecff}.type-visual{--fg:#b75342;--bg:#fff0e9}.type-rule{--fg:#187763;--bg:#dff5ec}.type-audio{--fg:#91601e;--bg:#fff1d6}.type-unknown{--fg:#667486;--bg:#edf1f5}.switcher{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#1e2938;color:white;border-radius:100px;padding:6px;display:flex;align-items:center;gap:4px;box-shadow:0 8px 24px #10203533;z-index:8}.switcher button{border:0;background:transparent;color:#d1d9e4;border-radius:30px;padding:10px 14px;font-size:12px}.switcher button.active{background:white;color:#142032}.switcher .label{font-size:11px;color:#b9c6d4;padding:0 10px}.variant-b .layout{grid-template-columns:210px minmax(0,1fr) 300px}.type-rail{background:#fff;border:1px solid #e5e9ef;border-radius:14px;padding:14px;position:sticky;top:18px}.type-rail h2{font-size:13px;color:#657487;margin:8px 8px 12px}.type-rail .pills{display:grid}.type-rail .pill{text-align:left}.variant-b .grid{display:block}.variant-b .item{border-radius:0;border:0;border-bottom:1px solid #e6eaf0;padding:13px 8px;align-items:center}.variant-b .item:first-child{border-radius:12px 12px 0 0}.variant-b .item:last-child{border-radius:0 0 12px 12px}.variant-b .cat{margin-top:5px}.variant-b .badge{width:36px;height:36px;flex-basis:36px}.variant-c .layout{grid-template-columns:330px minmax(0,1fr)}.variant-c .source{max-height:calc(100vh - 195px);overflow:auto;padding:2px 8px 5px 0}.variant-c .grid{display:block}.variant-c .item{margin-bottom:8px;padding:10px}.variant-c .item .desc,.variant-c .item .cat{display:none}.variant-c .workspace{position:relative;top:auto;min-height:470px;background:#f2f6fc;border:1px solid #dce6f4;padding:24px}.variant-c .dropzone{margin-top:24px;min-height:260px;background:#ffffffbc;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-content:start}.variant-c .empty{grid-column:1/-1;align-self:center;margin:auto}.variant-c .selected{align-self:start;background:white;border:1px solid #e6ebf3;padding:14px;min-height:70px}.variant-c .workspace-foot{grid-template-columns:1fr 1fr}.search:focus{border-color:#1673e6}.dragging{opacity:.45} .detail{border:0;background:none;padding:0;text-align:left;color:inherit}.demo-dialog{border:0;border-radius:16px;box-shadow:0 20px 60px #1b293a33;max-width:420px;padding:24px}.demo-dialog::backdrop{background:#0c1a2e55}.dialogclose{float:right;border:0;background:#eef2f6;border-radius:8px;padding:6px 10px}.demo-dialog p{margin-top:14px;line-height:1.7;color:#526172;font-size:14px}@media(min-width:761px) and (max-width:1100px){.variant-a .grid,.variant-c .dropzone{grid-template-columns:1fr}}@media(max-width:1000px){.variant-b .layout{grid-template-columns:minmax(0,1fr) 300px}.type-rail{position:static;grid-column:1/-1}.type-rail .pills{display:flex;margin:0}.type-rail h2{display:none}}@media(max-width:760px){.shell{grid-template-columns:48px 1fr}.nav{padding:18px 5px}.main{padding:22px 16px 100px}header{display:block}.notice{margin-top:12px}.layout,.variant-b .layout,.variant-c .layout{grid-template-columns:1fr}.workspace,.type-rail{position:static}.variant-c .source{max-height:none}.grid{grid-template-columns:1fr}.variant-c .dropzone{grid-template-columns:1fr;min-height:140px}.variant-c .workspace{min-height:0}.switcher .label{display:none}.switcher button{padding:10px 11px}}
</style></head><body><div class="shell"><aside class="nav"><span class="logo">C</span><span>工作台</span><span>Skill</span><span>Agent</span></aside><main class="main" id="app"></main></div><nav class="switcher" aria-label="设计方案切换"><span class="label">方案对比</span><button data-v="a">A · 素材库</button><button data-v="b">B · 分类目录</button><button data-v="c">C · 组装台</button></nav><dialog class="demo-dialog" id="detail"><button class="dialogclose" type="button" aria-label="关闭">×</button><h2></h2><p></p><p>示意内容，仅供设计讨论。</p></dialog><script>
// Three throwaway Skill workspace concepts. All selections and categories are illustrative, memory-only.
const types={mind:{name:'思考',icon:'<circle cx="12" cy="12" r="8"/><path d="M8 12h8M12 8v8"/>'},visual:{name:'视觉',icon:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="m7 16 4-4 3 3 2-2 2 3"/>'},rule:{name:'规则',icon:'<path d="M12 3 20 7v10l-8 4-8-4V7z"/><path d="m8.5 12 2.2 2.2 4.8-5"/>'},audio:{name:'音频',icon:'<path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4"/>'},unknown:{name:'未分类',icon:'<circle cx="12" cy="12" r="8" stroke-dasharray="2 3"/><path d="M12 8v4m0 4h.01"/>'}};
const items=[{id:'en',name:'莓说英语',type:'visual',desc:'为英语词汇制作四格学习卡'},{id:'bgm',name:'BGM Understanding',type:'audio',desc:'分析音乐节拍与段落变化'},{id:'mind',name:'knowledge-to-storyboard',type:'mind',desc:'将知识组织为分镜思路'},{id:'rule',name:'画面一致性规则',type:'rule',desc:'保持角色与视觉元素的一致性'},{id:'insist',name:'坚持',type:'visual',desc:'固定主体，探索不同外部场景'},{id:'beat',name:'image-beat-story',type:'audio',desc:'将图片与音乐编排为短视频'},{id:'idea',name:'选题判断',type:'mind',desc:'整理选题的切入点与结构'},{id:'other',name:'未分类 Skill',type:'unknown',desc:'类别待确认'}];
let variant=new URL(location.href).searchParams.get('variant')||'a',filter='all',query='',selected=[]; if(!['a','b','c'].includes(variant))variant='a';
const names={a:'素材库',b:'分类目录',c:'组装台'};const app=document.querySelector('#app');const label=s=>s.replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
function badge(t){return `<span class="badge type-${t}" aria-hidden="true"><svg viewBox="0 0 24 24">${types[t].icon}</svg></span>`}
function pills(){return [['all','全部'],...Object.entries(types).map(([k,v])=>[k,v.name])].map(([k,v])=>`<button class="pill ${filter===k?'active':''}" data-filter="${k}" aria-pressed="${filter===k}">${v}</button>`).join('')}
function card(s){let on=selected.includes(s.id);return `<article class="item type-${s.type}" draggable="true" data-drag="${s.id}">${badge(s.type)}<div class="item-copy"><button class="detail" data-detail="${s.id}" aria-label="查看 ${label(s.name)}"><strong>${label(s.name)}</strong></button><p class="desc">${label(s.desc)}</p><span class="cat">${types[s.type].name} · 演示分类</span></div><button class="add" data-add="${s.id}" aria-pressed="${on}" aria-label="${on?'移除':'加入'} ${label(s.name)}">${on?'✓':'+'}</button></article>`}
function workspace(){let values=selected.map(id=>items.find(i=>i.id===id)).filter(Boolean);return `<aside class="workspace"><div class="workspace-head"><h2>${variant==='c'?'栏目组装台':'栏目工作区'}</h2><span class="muted">${values.length} 项</span></div><div class="target">目标栏目<strong>小莓say（示意）</strong></div><div class="dropzone" data-drop aria-label="Skill 组合区域">${values.length?values.map(s=>`<div class="selected">${badge(s.type)}<b>${label(s.name)}</b><button class="remove" data-remove="${s.id}" aria-label="移除 ${label(s.name)}">×</button></div>`).join(''):'<p class="empty">拖入 Skill，或用 + 添加<br>仅预览，不会保存</p>'}</div><div class="workspace-foot"><button class="action primary" data-demo>保存到栏目</button><button class="action" data-demo>融合成新 Skill</button></div><p class="footnote" role="status">${values.length?'已选 '+values.length+' 项 · 尚未保存':'拖拽与选择只修改演示草稿'}</p></aside>`}
function render(){app.className='main variant-'+variant; const list=items.filter(s=>(filter==='all'||s.type===filter)&&(s.name+' '+s.desc).toLowerCase().includes(query.toLowerCase()));let source=`<div class="source"><div class="section-head"><h2>${variant==='b'?'所有 Skill':'探索 Skill'}</h2><span class="muted">${list.length} 个示例</span></div><input class="search" aria-label="搜索 Skill" placeholder="搜索 Skill…" value="${label(query)}">${variant!=='b'?`<div class="pills">${pills()}</div>`:''}<div class="grid">${list.map(card).join('')||'<p class="empty">没有匹配的 Skill</p>'}</div></div>`;let rail=variant==='b'?`<aside class="type-rail"><h2>按用途浏览</h2><div class="pills">${pills()}</div></aside>`:'';app.innerHTML=`<header><div><h1>Skill 库</h1><p class="sub">${variant==='a'?'找到创作素材，组合属于你的栏目':variant==='b'?'按用途浏览，挑选需要的创作能力':'把不同 Skill 放在一起，搭建栏目资料池'}</p></div><span class="notice">设计试验 · 示例数据，不会保存</span></header><div class="topactions"><button class="action" data-demo>从作品提炼</button><button class="action" data-demo>自己写 Skill</button><button class="action" data-demo>安装 Skill</button></div><div class="layout">${rail}${source}${workspace()}</div>`;document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('active',b.dataset.v===variant));bind()}
function bind(){app.querySelector('.search').addEventListener('input',e=>{let pos=e.target.selectionStart;query=e.target.value;render();let n=app.querySelector('.search');n.focus();n.setSelectionRange(pos,pos)});app.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});app.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>toggle(b.dataset.add));app.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>toggle(b.dataset.remove));app.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>{let s=items.find(x=>x.id===b.dataset.detail);let d=document.querySelector('#detail');d.querySelector('h2').textContent=s.name;d.querySelector('p').textContent=s.desc+' · '+types[s.type].name;d.showModal()});app.querySelectorAll('[data-demo]').forEach(b=>b.onclick=()=>{let d=document.querySelector('#detail');d.querySelector('h2').textContent='设计预览';d.querySelector('p').textContent='这是示意操作，不会修改数据或执行生产。';d.showModal()});let zone=app.querySelector('[data-drop]');zone.ondragover=e=>{e.preventDefault();zone.classList.add('over')};zone.ondragleave=()=>zone.classList.remove('over');zone.ondrop=e=>{e.preventDefault();zone.classList.remove('over');let id=e.dataTransfer.getData('text/plain');if(items.some(s=>s.id===id)&&!selected.includes(id)){selected.push(id);render()}};app.querySelectorAll('[data-drag]').forEach(el=>{el.ondragstart=e=>{e.dataTransfer.setData('text/plain',el.dataset.drag);e.dataTransfer.effectAllowed='copy';el.classList.add('dragging')};el.ondragend=()=>el.classList.remove('dragging')})}
function toggle(id){selected=selected.includes(id)?selected.filter(x=>x!==id):[...selected,id];render();app.querySelector(`[data-add="${id}"]`)?.focus()}
function change(v){variant=v;filter='all';let url=new URL(location.href);url.searchParams.set('variant',v);history.replaceState({},'',url);render();window.scrollTo(0,0)}
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>change(b.dataset.v));document.querySelector('.dialogclose').onclick=()=>document.querySelector('#detail').close();document.addEventListener('keydown',e=>{if(document.querySelector('#detail').open||/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){let keys=['a','b','c'];change(keys[(keys.indexOf(variant)+(e.key==='ArrowRight'?1:2))%3])}});render();
</script></body></html>
